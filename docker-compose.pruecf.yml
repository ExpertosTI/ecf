# docker-compose.pruecf.yml
# Instancia de Staging Totalmente Aislada
version: '3.8'

services:
  pruecf-api:
    image: ecf-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://renace_ecf:${DB_PASSWORD}@pruecf-postgres:5432/renace_ecf
      REDIS_URL: redis://pruecf-redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ECF_AMBIENTE: certificacion
      TZ: America/Santo_Dominigo
    networks:
      - pruecf_net
      - RenaceNet
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pruecf-api.rule=Host(`${PRUECF_DOMAIN:-pruecf.renace.tech}`)"
        - "traefik.http.routers.pruecf-api.entrypoints=websecure"
        - "traefik.http.routers.pruecf-api.tls=true"
        - "traefik.http.routers.pruecf-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.pruecf-api.loadbalancer.server.port=8000"

  pruecf-worker:
    image: ecf-api:latest
    command: python -m ecf_core.worker_main
    environment:
      DATABASE_URL: postgresql://renace_ecf:${DB_PASSWORD}@pruecf-postgres:5432/renace_ecf
      REDIS_URL: redis://pruecf-redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
    networks:
      - pruecf_net

  pruecf-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: renace_ecf
      POSTGRES_USER: renace_ecf
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pruecf_pgdata:/var/lib/postgresql/data
    networks:
      - pruecf_net

  pruecf-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    volumes:
      - pruecf_redisdata:/data
    networks:
      - pruecf_net

networks:
  pruecf_net:
  RenaceNet:
    external: true

volumes:
  pruecf_pgdata:
  pruecf_redisdata:
